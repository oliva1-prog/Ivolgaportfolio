<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Portfolio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div class="carousel-wrapper">
      <div class="carousel">
        <div class="carousel-item" data-title="Проект 1" data-description="Брендирование и визуальная идентичность для современной компании. Разработка полного набора дизайн-систем.">
          <img src="https://via.placeholder.com/400x400/6b5b95/ffffff?text=Проект+1" alt="Проект 1">
        </div>
        <div class="carousel-item" data-title="Проект 2" data-description="Разработка маркетинговой кампании с акцентом на творческую коммуникацию и визуальное повествование.">
          <img src="https://via.placeholder.com/400x400/88b0d3/ffffff?text=Проект+2" alt="Проект 2">
        </div>
        <div class="carousel-item" data-title="Проект 3" data-description="Создание бренд-гайдлайна для международного проекта. Разработка правил использования бренда.">
          <img src="https://via.placeholder.com/400x400/a0a57e/ffffff?text=Проект+3" alt="Проект 3">
        </div>
        <div class="carousel-item" data-title="Проект 4" data-description="Дизайн упаковки и коллатеральных материалов. Внимание к каждой детали и типографике.">
          <img src="https://via.placeholder.com/400x400/c0504d/ffffff?text=Проект+4" alt="Проект 4">
        </div>
        <div class="carousel-item" data-title="Проект 5" data-description="Разработка корпоративного стиля: логотип, палитра, типография, фотостиль и иконография.">
          <img src="https://via.placeholder.com/400x400/d4a574/ffffff?text=Проект+5" alt="Проект 5">
        </div>
      </div>
    </div>

    <div class="center-content">
      <h1 class="name">Ольга Иващенко</h1>
      <p class="title">Коммуникационный и бренд-дизайнер, Пермь</p>
      <button class="invite-btn">Пригласить в проект</button>
    </div>

    <div class="modal" id="mobileModal">
      <div class="modal-content">
        <img id="modalImage" src="" alt="">
        <div class="modal-description">
          <h2 id="modalTitle"></h2>
          <p id="modalText"></p>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
